<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Databricks Quiz</title>

<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:24px;background:#f6f7fb}
.card{max-width:720px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
h1{margin:0 0 12px;font-size:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,button{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#fff}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.65}
.primary{background:#111;color:#fff;border-color:#111}
.prompt{margin:18px 0;padding:14px;border-radius:12px;background:#f1f3ff;font-size:18px;white-space:pre-wrap}
.options{display:grid;gap:10px}
.opt{text-align:left;width:100%;white-space:pre-wrap}
.status{margin-top:14px;font-size:15px}
.ok{color:#0a7a2f;font-weight:600}
.bad{color:#b00020;font-weight:600}
.score{margin-left:auto;font-weight:700}
.muted{color:#666}
.explain{margin-top:10px;padding:12px;border-radius:12px;background:#f7f7f7;white-space:pre-wrap}

.progress{height:6px;background:#eee;border-radius:6px;margin:10px 0}
.bar{height:100%;background:#4f6df5;border-radius:6px;width:0%}

.optCheck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer;user-select:none}
.actionsRow{display:flex;gap:10px;flex-wrap:wrap}

.opt.active,
.optCheck.active{
  border-color:#4f6df5;
  box-shadow:0 0 0 3px rgba(79,109,245,.16);
  background:#f7f9ff;
}
</style>
</head>

<body>

<div class="card">

<div class="row">
<h1 id="title">Databricks Professional Quiz</h1>
<div class="score" id="score">0/0</div>
</div>

<div class="progress"><div id="bar" class="bar"></div></div>

<div class="row">

<label class="muted">Quiz:</label>
<select id="quiz">
<option value="dbx-professional" selected>Databricks Professional</option>
<option value="dbx-associate">Databricks Associate</option>
</select>

<span id="examWrapAssociate" style="display:none">
<label class="muted">Examen:</label>
<select id="examAssociate">
<option value="1">1 EN</option>
<option value="1es">1 ES</option>
<option value="2">2 EN</option>
<option value="2es">2 ES</option>
<option value="3">3 EN</option>
<option value="3es">3 ES</option>
<option value="4">4 EN</option>
<option value="4es">4 ES</option>
<option value="5">5 EN</option>
<option value="5es">5 ES</option>
<option value="all">All EN</option>
<option value="alles">All ES</option>
</select>
</span>

<span id="examWrapProfessional" style="display:none">
<label class="muted">Examen:</label>
<select id="examProfessional">
<option value="1">1 EN</option>
<option value="1es">1 ES</option>
<option value="all">All EN</option>
<option value="alles">All ES</option>
</select>
</span>

<button id="btnReset">Reiniciar</button>
<button id="btnPrev">Atrás</button>
<button id="btnNext" class="primary">Siguiente</button>

</div>

<div id="prompt" class="prompt">Pulsa “Siguiente”.</div>
<div id="options" class="options"></div>
<div id="status" class="status"></div>

</div>

<script>
const $ = id => document.getElementById(id)

const title = $("title")
const prompt = $("prompt")
const options = $("options")
const status = $("status")
const quiz = $("quiz")

const examAssociate = $("examAssociate")
const examProfessional = $("examProfessional")
const examWrapAssociate = $("examWrapAssociate")
const examWrapProfessional = $("examWrapProfessional")

const score = $("score")
const bar = $("bar")

const btnNext = $("btnNext")
const btnPrev = $("btnPrev")
const btnReset = $("btnReset")

let current = null
let history = []
let historyIndex = -1
let correct = 0
let answered = 0
let locked = false
let activeOptionIndex = -1

const getTrack = () => quiz.value === "dbx-professional" ? "professional" : "associate"
const getExam = () => quiz.value === "dbx-professional" ? examProfessional.value : examAssociate.value

function clone(obj){
  return JSON.parse(JSON.stringify(obj))
}

function getNavigableOptions(){
  return [...options.querySelectorAll(".opt, .optCheck")]
}

function setActiveOption(idx){
  const items = getNavigableOptions()
  if(!items.length){
    activeOptionIndex = -1
    return
  }

  if(idx < 0) idx = 0
  if(idx >= items.length) idx = items.length - 1

  items.forEach(el => el.classList.remove("active"))
  items[idx].classList.add("active")
  activeOptionIndex = idx
}

function setActiveFromElement(el){
  const items = getNavigableOptions()
  const idx = items.indexOf(el)
  if(idx >= 0) setActiveOption(idx)
}

function resetOptionNavigation(){
  activeOptionIndex = -1
}

function initOptionNavigation(){
  const items = getNavigableOptions()
  if(items.length) setActiveOption(0)
}

function isTypingTarget(el){
  if(!el) return false
  const tag = (el.tagName || "").toLowerCase()
  return tag === "input" || tag === "textarea" || tag === "select"
}

function updateScore(progress){
  score.textContent = `${correct}/${answered}`

  if(progress){
    score.textContent += ` · ${progress.seen}/${progress.total}`
    bar.style.width = (progress.seen / progress.total * 100) + "%"
  } else {
    bar.style.width = "0%"
  }
}

function clearQuestionArea(){
  options.innerHTML = ""
  status.textContent = ""
  resetOptionNavigation()
}

function resetLocal(){
  correct = 0
  answered = 0
  history = []
  historyIndex = -1
  current = null
  locked = false
  clearQuestionArea()
  prompt.textContent = "Pulsa “Siguiente”."
  updateScore()
  updatePrevButton()
}

function updatePrevButton(){
  btnPrev.disabled = historyIndex <= 0
}

function applyUI(){
  const q = quiz.value

  examWrapAssociate.style.display = q === "dbx-associate" ? "flex" : "none"
  examWrapProfessional.style.display = q === "dbx-professional" ? "flex" : "none"

  title.textContent =
    q === "dbx-professional" ? "Databricks Professional Quiz" :
    "Databricks Associate Quiz"

  resetLocal()
}

async function resetGame(){
  const url = `/api/dbx/reset/?track=${getTrack()}&exam=${getExam()}`
  await fetch(url)
  resetLocal()
  status.textContent = "🔄 Reiniciado"
}

function createHistoryEntry(questionData){
  return {
    question: clone(questionData),
    selected: null,
    result: null,
    answeredSnapshot: answered,
    correctSnapshot: correct
  }
}

function saveAnswerInHistory(selected, result){
  if(historyIndex < 0) return
  const entry = history[historyIndex]
  entry.selected = Array.isArray(selected) ? [...selected] : selected
  entry.result = clone(result)
  entry.answeredSnapshot = answered
  entry.correctSnapshot = correct
}

function paintSingleResult(result, selected){
  const buttons = [...options.querySelectorAll(".opt")]
  buttons.forEach(b => {
    if(b.textContent === result.correct){
      b.style.borderColor = "#0a7a2f"
      b.style.boxShadow = "0 0 0 3px rgba(10,122,47,.15)"
      b.classList.add("active")
    }
    if(b.textContent === selected && !result.ok){
      b.style.borderColor = "#b00020"
      b.style.boxShadow = "0 0 0 3px rgba(176,0,32,.12)"
      b.classList.add("active")
    }
    b.disabled = true
  })
}

function paintMultiResult(result, selectedList){
  const correctSet = new Set(Array.isArray(result.correct) ? result.correct : [result.correct])
  const pickedSet = new Set(selectedList || [])

  ;[...options.querySelectorAll(".optCheck")].forEach(row => {
    const cb = row.querySelector("input[type='checkbox']")
    const val = cb.value

    if(correctSet.has(val)){
      row.style.borderColor = "#0a7a2f"
      row.style.boxShadow = "0 0 0 3px rgba(10,122,47,.15)"
    }
    if(pickedSet.has(val) && !correctSet.has(val)){
      row.style.borderColor = "#b00020"
      row.style.boxShadow = "0 0 0 3px rgba(176,0,32,.12)"
    }

    if(pickedSet.has(val)){
      row.classList.add("active")
    }

    cb.disabled = true
  })
}

function renderStatus(result){
  status.innerHTML =
    (result.ok ? `<span class='ok'>✅ Correcto</span>` : `<span class='bad'>❌ Incorrecto</span>`) +
    `<div class="explain">${result.explanation || ""}</div>`
}

function renderQuestion(questionData, entry = null, readOnly = false){
  current = clone(questionData)
  clearQuestionArea()
  locked = false

  if(current.done){
    prompt.textContent = "✅ Fin"
    return
  }

  prompt.textContent = current.question
  updateScore(current.progress)

  if(!current.is_multi){
    current.options.forEach(opt => {
      const b = document.createElement("button")
      b.className = "opt"
      b.textContent = opt

      b.onclick = () => {
        if(locked || readOnly) return
        setActiveFromElement(b)
        answerSingle(opt)
      }

      b.addEventListener("mouseenter", () => {
        if(locked || readOnly) return
        setActiveFromElement(b)
      })

      b.addEventListener("click", () => {
        if(locked || readOnly) return
        setActiveFromElement(b)
      })

      options.appendChild(b)
    })

    initOptionNavigation()

    if(entry?.selected){
      const target = [...options.querySelectorAll(".opt")].find(b => b.textContent === entry.selected)
      if(target) setActiveFromElement(target)
    }

    if(entry?.result){
      locked = true
      paintSingleResult(entry.result, entry.selected)
      renderStatus(entry.result)
    }

    return
  }

  current.options.forEach(opt => {
    const label = document.createElement("label")
    label.className = "optCheck"

    const cb = document.createElement("input")
    cb.type = "checkbox"
    cb.value = opt

    if(Array.isArray(entry?.selected) && entry.selected.includes(opt)){
      cb.checked = true
      label.classList.add("active")
    }

    label.append(cb, document.createTextNode(opt))

    label.addEventListener("mouseenter", () => {
      if(locked || readOnly) return
      setActiveFromElement(label)
    })

    label.addEventListener("click", () => {
      if(readOnly) return
      setActiveFromElement(label)
    })

    if(readOnly || entry?.result){
      cb.disabled = true
    }

    options.appendChild(label)
  })

  if(!(readOnly || entry?.result)){
    const wrap = document.createElement("div")
    wrap.className = "actionsRow"

    const btn = document.createElement("button")
    btn.textContent = "Comprobar"
    btn.className = "primary"
    btn.onclick = answerMulti

    wrap.appendChild(btn)
    options.appendChild(wrap)
  }

  initOptionNavigation()

  if(Array.isArray(entry?.selected) && entry.selected.length){
    const firstSelected = [...options.querySelectorAll(".optCheck")]
      .find(row => entry.selected.includes(row.querySelector("input").value))
    if(firstSelected) setActiveFromElement(firstSelected)
  }

  if(entry?.result){
    locked = true
    paintMultiResult(entry.result, entry.selected)
    renderStatus(entry.result)
  }
}

function restoreHistoryEntry(index){
  const entry = history[index]
  if(!entry) return

  historyIndex = index
  answered = entry.answeredSnapshot
  correct = entry.correctSnapshot
  updatePrevButton()

  const readOnly = !!entry.result
  renderQuestion(entry.question, entry, readOnly)
}

async function loadQuestion(){
  locked = false
  clearQuestionArea()
  prompt.textContent = "Cargando..."

  if(historyIndex >= 0 && historyIndex < history.length - 1){
    restoreHistoryEntry(historyIndex + 1)
    return
  }

  const res = await fetch(`/api/dbx/next/?track=${getTrack()}&exam=${getExam()}`)
  const data = await res.json()

  current = data

  if(current.done){
    prompt.textContent = "✅ Fin"
    options.innerHTML = ""
    return
  }

  history.push(createHistoryEntry(current))
  historyIndex = history.length - 1
  updatePrevButton()

  renderQuestion(current)
}

async function answerSingle(picked){
  if(locked) return
  locked = true
  answered++

  const res = await fetch("/api/dbx/check/", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:current.id,picked,track:current.track,exam:current.exam})
  })

  const data = await res.json()

  if(data.ok) correct++
  updateScore(current.progress)

  saveAnswerInHistory(picked, data)
  paintSingleResult(data, picked)
  renderStatus(data)
}

async function answerMulti(){
  if(locked) return

  const picked = [...options.querySelectorAll("input:checked")].map(x => x.value)
  if(!picked.length) return

  locked = true
  answered++

  const res = await fetch("/api/dbx/check/", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:current.id,picked,track:current.track,exam:current.exam})
  })

  const data = await res.json()

  if(data.ok) correct++
  updateScore(current.progress)

  saveAnswerInHistory(picked, data)
  paintMultiResult(data, picked)
  renderStatus(data)
}

function goPrev(){
  if(historyIndex <= 0) return
  restoreHistoryEntry(historyIndex - 1)
}

btnNext.onclick = loadQuestion
btnPrev.onclick = goPrev
btnReset.onclick = resetGame

quiz.onchange = applyUI
examAssociate.onchange = () => {
  resetLocal()
  loadQuestion()
}
examProfessional.onchange = () => {
  resetLocal()
  loadQuestion()
}

document.addEventListener("keydown", e => {
  if(isTypingTarget(e.target)) return

  if(e.key === "ArrowDown"){
    e.preventDefault()
    const items = getNavigableOptions()
    if(!items.length) return
    setActiveOption(activeOptionIndex < 0 ? 0 : activeOptionIndex + 1)
    return
  }

  if(e.key === "ArrowUp"){
    e.preventDefault()
    const items = getNavigableOptions()
    if(!items.length) return
    setActiveOption(activeOptionIndex < 0 ? 0 : activeOptionIndex - 1)
    return
  }

  if(e.key === "Enter"){
    const items = getNavigableOptions()
    if(activeOptionIndex >= 0 && items[activeOptionIndex]){
      e.preventDefault()

      const active = items[activeOptionIndex]

      if(active.classList.contains("opt")){
        active.click()
        return
      }

      if(active.classList.contains("optCheck")){
        const cb = active.querySelector("input[type='checkbox']")
        if(cb && !locked){
          cb.checked = !cb.checked
          setActiveFromElement(active)
        }
      }
      return
    }
  }

  if(e.key === "ArrowRight" || e.key === " "){
    e.preventDefault()
    btnNext.click()
    return
  }

  if(e.key === "ArrowLeft"){
    e.preventDefault()
    btnPrev.click()
  }
})

applyUI()
</script>
</body>
</html>
