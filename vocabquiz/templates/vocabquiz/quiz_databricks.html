<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Databricks Quiz</title>
<style>
  :root {
    --brand: #ff3621;
    --accent: #1a56db;
    --accent-soft: #eff4ff;
    --ok-color: #057a55;
    --ok-soft: #def7ec;
    --bad-color: #c81e1e;
    --bad-soft: #fde8e8;
    --text: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.09);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0; padding: 24px 16px 60px;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  .card {
    max-width: 780px; margin: auto;
    background: var(--card-bg); border-radius: 20px;
    padding: 28px 28px 36px; box-shadow: var(--shadow);
  }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .logo {
    width: 32px; height: 32px; background: var(--brand);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0; letter-spacing: -.5px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 700; flex: 1; }
  .score-box { display: flex; align-items: center; gap: 8px; }
  #score {
    font-size: 13px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 4px 14px; white-space: nowrap;
  }
  #streakBadge {
    font-size: 13px; font-weight: 600;
    background: #fff8e1; color: #b45309;
    border-radius: 999px; padding: 4px 10px;
    display: none; white-space: nowrap; transition: transform .2s;
  }
  #streakBadge.bump { transform: scale(1.25); }
  .progress-wrap { margin: 8px 0 20px; }
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-muted); margin-bottom: 5px;
  }
  .progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, #818cf8 100%);
    border-radius: 999px; width: 0%; transition: width .4s ease;
  }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 14px; background: var(--bg); border-radius: var(--radius); margin-bottom: 20px;
  }
  .ctrl-group { display: flex; align-items: center; gap: 6px; }
  label.lbl { font-size: 13px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  select {
    font-size: 14px; padding: 7px 10px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);
    cursor: pointer; outline: none; transition: border-color .15s;
  }
  select:focus { border-color: var(--accent); }
  .btn-group { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
  button {
    font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 9px;
    border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);
    cursor: pointer; transition: background .12s, border-color .12s, opacity .15s, transform .1s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--bg); border-color: #9ca3af; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { cursor: not-allowed; opacity: .4; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: #1648c7; border-color: #1648c7; }
  .btn-reset { color: var(--bad-color); border-color: #fca5a5; }
  .btn-reset:hover:not(:disabled) { background: var(--bad-soft); border-color: var(--bad-color); }
  .kbd-hint {
    font-size: 11px; color: var(--text-muted); text-align: right;
    margin-bottom: 14px; user-select: none;
  }
  kbd {
    display: inline-block; background: #f3f4f6; border: 1px solid #d1d5db;
    border-radius: 4px; padding: 1px 5px; font-size: 10px; font-family: inherit;
  }
  .multi-hint {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 6px; padding: 4px 12px; margin-bottom: 12px;
  }
  #prompt {
    margin: 0 0 18px; padding: 18px 20px; border-radius: var(--radius);
    background: var(--accent-soft); border-left: 4px solid var(--accent);
    font-size: 16.5px; line-height: 1.65; white-space: pre-wrap; color: var(--text);
  }
  .options { display: grid; gap: 10px; }
  .opt {
    text-align: left; width: 100%; white-space: pre-wrap; line-height: 1.55;
    font-size: 15px; padding: 12px 16px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);
    transition: background .12s, border-color .12s;
  }
  .opt:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  .opt.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,.13); background: var(--accent-soft); }
  .opt.correct-ans { border-color: var(--ok-color) !important; background: var(--ok-soft) !important; box-shadow: 0 0 0 3px rgba(5,122,85,.13) !important; }
  .opt.wrong-ans   { border-color: var(--bad-color) !important; background: var(--bad-soft) !important; box-shadow: 0 0 0 3px rgba(200,30,30,.12) !important; }
  .optCheck {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px;
    border-radius: 10px; border: 1.5px solid var(--border); background: var(--card-bg);
    cursor: pointer; user-select: none; font-size: 15px; line-height: 1.55;
    transition: background .12s, border-color .12s;
  }
  .optCheck:hover { background: var(--accent-soft); border-color: var(--accent); }
  .optCheck.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,.13); background: var(--accent-soft); }
  .optCheck.correct-ans { border-color: var(--ok-color) !important; background: var(--ok-soft) !important; box-shadow: 0 0 0 3px rgba(5,122,85,.13) !important; }
  .optCheck.wrong-ans   { border-color: var(--bad-color) !important; background: var(--bad-soft) !important; box-shadow: 0 0 0 3px rgba(200,30,30,.12) !important; }
  .optCheck input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .actionsRow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .status { margin-top: 18px; }
  .result-banner {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-radius: 10px; font-weight: 700; font-size: 16px; margin-bottom: 10px;
  }
  .result-banner.ok  { background: var(--ok-soft);  color: var(--ok-color); }
  .result-banner.bad { background: var(--bad-soft); color: var(--bad-color); }
  .explain {
    padding: 14px 16px; border-radius: 10px; background: #fafafa;
    border: 1.5px solid var(--border); white-space: pre-wrap;
    font-size: 14px; line-height: 1.65; color: #374151;
  }
  .done-card { text-align: center; padding: 24px 0 8px; }
  .done-card .big { font-size: 52px; }
  .done-card h2 { font-size: 22px; margin: 8px 0 4px; }
  .done-card p { color: var(--text-muted); margin: 0 0 16px; }
  .done-score {
    display: inline-block; font-size: 28px; font-weight: 800;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 14px; padding: 8px 28px; margin-bottom: 18px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">Db</div>
    <h1 id="title">Databricks Professional Quiz</h1>
    <div class="score-box">
      <span id="streakBadge">🔥 0</span>
      <span id="score">0/0</span>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-labels">
      <span id="progressLabel">Progreso</span>
      <span id="progressPct">—</span>
    </div>
    <div class="progress"><div id="bar" class="bar"></div></div>
  </div>
  <div class="controls">
    <div class="ctrl-group">
      <label class="lbl" for="quiz">Quiz:</label>
      <select id="quiz">
        <option value="dbx-professional" selected>Professional</option>
        <option value="dbx-associate">Associate</option>
      </select>
    </div>
    <span id="examWrapAssociate" style="display:none" class="ctrl-group">
      <label class="lbl" for="examAssociate">Examen:</label>
      <select id="examAssociate">
        <option value="1">1 EN</option><option value="1es">1 ES</option>
        <option value="2">2 EN</option><option value="2es">2 ES</option>
        <option value="3">3 EN</option><option value="3es">3 ES</option>
        <option value="4">4 EN</option><option value="4es">4 ES</option>
        <option value="5">5 EN</option><option value="5es">5 ES</option>
        <option value="all">All EN</option><option value="alles">All ES</option>
      </select>
    </span>
    <span id="examWrapProfessional" style="display:none" class="ctrl-group">
      <label class="lbl" for="examProfessional">Examen:</label>
      <select id="examProfessional">
        <option value="1">1 EN</option><option value="1es">1 ES</option>
        <option value="2">2 EN</option><option value="2es">2 ES</option>
        <option value="3">3 EN</option><option value="3es">3 ES</option>
        <option value="all">All EN</option><option value="alles">All ES</option>
      </select>
    </span>
    <div class="btn-group">
      <button id="btnReset" class="btn-reset">↺ Reiniciar</button>
      <button id="btnPrev" disabled>← Atrás</button>
      <button id="btnNext" class="btn-primary">Siguiente →</button>
    </div>
  </div>
  <div class="kbd-hint">
    Navegar: <kbd>↑</kbd><kbd>↓</kbd> &nbsp;|&nbsp;
    Confirmar: <kbd>Enter</kbd> &nbsp;|&nbsp;
    Avanzar: <kbd>→</kbd> / <kbd>Space</kbd> &nbsp;|&nbsp;
    Retroceder: <kbd>←</kbd>
  </div>
  <div id="multiHint" class="multi-hint" style="display:none">☑ Selecciona TODAS las respuestas correctas</div>
  <div id="prompt" class="prompt">Pulsa "Siguiente →" para empezar.</div>
  <div id="options" class="options"></div>
  <div id="status" class="status"></div>
</div>
<script>
const $ = id => document.getElementById(id)
const titleEl=$("title"),promptEl=$("prompt"),optionsEl=$("options"),statusEl=$("status"),quizEl=$("quiz"),multiHintEl=$("multiHint")
const examAssociate=$("examAssociate"),examProfessional=$("examProfessional")
const examWrapAssociate=$("examWrapAssociate"),examWrapProfessional=$("examWrapProfessional")
const scoreEl=$("score"),barEl=$("bar"),streakBadgeEl=$("streakBadge"),progressLabel=$("progressLabel"),progressPct=$("progressPct")
const btnNext=$("btnNext"),btnPrev=$("btnPrev"),btnReset=$("btnReset")
let current=null,history=[],historyIndex=-1,correct=0,answered=0,streak=0,locked=false,activeOptionIndex=-1
const getTrack=()=>quizEl.value==="dbx-professional"?"professional":"associate"
const getExam=()=>quizEl.value==="dbx-professional"?examProfessional.value:examAssociate.value
function clone(o){return JSON.parse(JSON.stringify(o))}
function getNavigableOptions(){return[...optionsEl.querySelectorAll(".opt,.optCheck")]}
function setActiveOption(idx){
  const items=getNavigableOptions();if(!items.length){activeOptionIndex=-1;return}
  if(idx<0)idx=0;if(idx>=items.length)idx=items.length-1
  items.forEach(el=>el.classList.remove("active"));items[idx].classList.add("active");activeOptionIndex=idx
}
function setActiveFromElement(el){const items=getNavigableOptions();const idx=items.indexOf(el);if(idx>=0)setActiveOption(idx)}
function resetOptionNavigation(){activeOptionIndex=-1}
function initOptionNavigation(){const items=getNavigableOptions();if(items.length)setActiveOption(0)}
function isTypingTarget(el){if(!el)return false;const tag=(el.tagName||"").toLowerCase();return tag==="input"||tag==="textarea"||tag==="select"}
function updateStreak(ok){
  if(ok){streak++}else{streak=0}
  if(streak>=3){
    streakBadgeEl.style.display="inline-block"
    streakBadgeEl.textContent="🔥 "+streak
    streakBadgeEl.classList.remove("bump")
    void streakBadgeEl.offsetWidth
    streakBadgeEl.classList.add("bump")
    setTimeout(()=>streakBadgeEl.classList.remove("bump"),300)
  }else{streakBadgeEl.style.display="none"}
}
function updateScore(progress){
  scoreEl.textContent="✓ "+correct+" / "+answered
  if(progress){
    const pct=Math.round(progress.seen/progress.total*100)
    barEl.style.width=pct+"%"
    progressLabel.textContent="Pregunta "+progress.seen+" de "+progress.total
    progressPct.textContent=pct+"%"
  }else{barEl.style.width="0%";progressLabel.textContent="Progreso";progressPct.textContent="—"}
}
function clearQuestionArea(){optionsEl.innerHTML="";statusEl.innerHTML="";multiHintEl.style.display="none";resetOptionNavigation()}
function resetLocal(){
  correct=0;answered=0;streak=0;history=[];historyIndex=-1;current=null;locked=false
  clearQuestionArea()
  promptEl.textContent='Pulsa "Siguiente →" para empezar.'
  streakBadgeEl.style.display="none";updateScore();updatePrevButton()
}
function updatePrevButton(){btnPrev.disabled=historyIndex<=0}
function applyUI(){
  const q=quizEl.value
  examWrapAssociate.style.display=q==="dbx-associate"?"flex":"none"
  examWrapProfessional.style.display=q==="dbx-professional"?"flex":"none"
  titleEl.textContent=q==="dbx-professional"?"Databricks Professional Quiz":"Databricks Associate Quiz"
  resetLocal()
}
async function resetGame(){
  await fetch("/api/dbx/reset/?track="+getTrack()+"&exam="+getExam())
  resetLocal()
  statusEl.innerHTML='<div class="result-banner" style="background:#f0f9ff;color:#0369a1">🔄 Quiz reiniciado</div>'
}
function createHistoryEntry(qd){return{question:clone(qd),selected:null,result:null,answeredSnapshot:answered,correctSnapshot:correct,streakSnapshot:streak}}
function saveAnswerInHistory(sel,res){
  if(historyIndex<0)return
  const e=history[historyIndex]
  e.selected=Array.isArray(sel)?[...sel]:sel;e.result=clone(res)
  e.answeredSnapshot=answered;e.correctSnapshot=correct;e.streakSnapshot=streak
}
function paintSingleResult(result,selected){
  ;[...optionsEl.querySelectorAll(".opt")].forEach(b=>{
    const txt=b.textContent.trim()
    if(txt===(result.correct||"").trim())b.classList.add("correct-ans")
    if(txt===(selected||"").trim()&&!result.ok)b.classList.add("wrong-ans")
    b.disabled=true
  })
}
function paintMultiResult(result,selectedList){
  const cs=new Set(Array.isArray(result.correct)?result.correct:[result.correct])
  const ps=new Set(selectedList||[])
  ;[...optionsEl.querySelectorAll(".optCheck")].forEach(row=>{
    const cb=row.querySelector("input[type='checkbox']"),val=cb.value
    if(cs.has(val))row.classList.add("correct-ans")
    if(ps.has(val)&&!cs.has(val))row.classList.add("wrong-ans")
    if(ps.has(val))row.classList.add("active")
    cb.disabled=true
  })
}
function renderStatus(result){
  const banner=document.createElement("div")
  banner.className="result-banner "+(result.ok?"ok":"bad")
  banner.textContent=result.ok?"✅ Correcto":"❌ Incorrecto"
  statusEl.innerHTML=""
  statusEl.appendChild(banner)
  if(result.explanation){const ex=document.createElement("div");ex.className="explain";ex.textContent=result.explanation;statusEl.appendChild(ex)}
}
function renderQuestion(questionData,entry=null,readOnly=false){
  current=clone(questionData);clearQuestionArea();locked=false
  if(current.done){
    const pct=answered>0?Math.round(correct/answered*100):0
    promptEl.innerHTML=""
    optionsEl.innerHTML='<div class="done-card"><div class="big">🎉</div><h2>¡Quiz completado!</h2><p>Has respondido todas las preguntas de este banco.</p><div class="done-score">'+correct+' / '+answered+' correctas &nbsp;·&nbsp; '+pct+'%</div><br/><button class="btn-primary" onclick="resetGame()">↺ Volver a empezar</button></div>'
    return
  }
  promptEl.textContent=current.question
  updateScore(current.progress)
  if(current.is_multi)multiHintEl.style.display="inline-flex"
  if(!current.is_multi){
    current.options.forEach(opt=>{
      const b=document.createElement("button");b.className="opt";b.textContent=opt
      b.onclick=()=>{if(locked||readOnly)return;setActiveFromElement(b);answerSingle(opt)}
      b.addEventListener("mouseenter",()=>{if(locked||readOnly)return;setActiveFromElement(b)})
      optionsEl.appendChild(b)
    })
    initOptionNavigation()
    if(entry?.selected){const t=[...optionsEl.querySelectorAll(".opt")].find(b=>b.textContent===entry.selected);if(t)setActiveFromElement(t)}
    if(entry?.result){locked=true;paintSingleResult(entry.result,entry.selected);renderStatus(entry.result)}
    return
  }
  current.options.forEach(opt=>{
    const label=document.createElement("label");label.className="optCheck"
    const cb=document.createElement("input");cb.type="checkbox";cb.value=opt
    if(Array.isArray(entry?.selected)&&entry.selected.includes(opt)){cb.checked=true;label.classList.add("active")}
    label.append(cb,document.createTextNode(opt))
    label.addEventListener("mouseenter",()=>{if(locked||readOnly)return;setActiveFromElement(label)})
    label.addEventListener("click",()=>{if(readOnly)return;setActiveFromElement(label)})
    if(readOnly||entry?.result)cb.disabled=true
    optionsEl.appendChild(label)
  })
  if(!(readOnly||entry?.result)){
    const wrap=document.createElement("div");wrap.className="actionsRow"
    const btn=document.createElement("button");btn.textContent="Comprobar respuesta";btn.className="btn-primary";btn.onclick=answerMulti
    wrap.appendChild(btn);optionsEl.appendChild(wrap)
  }
  initOptionNavigation()
  if(Array.isArray(entry?.selected)&&entry.selected.length){
    const fs=[...optionsEl.querySelectorAll(".optCheck")].find(r=>entry.selected.includes(r.querySelector("input").value))
    if(fs)setActiveFromElement(fs)
  }
  if(entry?.result){locked=true;paintMultiResult(entry.result,entry.selected);renderStatus(entry.result)}
}
function restoreHistoryEntry(index){
  const entry=history[index];if(!entry)return
  historyIndex=index;answered=entry.answeredSnapshot;correct=entry.correctSnapshot;streak=entry.streakSnapshot??0
  updatePrevButton();renderQuestion(entry.question,entry,!!entry.result)
}
async function loadQuestion(){
  locked=false;clearQuestionArea();promptEl.textContent="Cargando..."
  if(historyIndex>=0&&historyIndex<history.length-1){restoreHistoryEntry(historyIndex+1);return}
  const res=await fetch("/api/dbx/next/?track="+getTrack()+"&exam="+getExam())
  const data=await res.json();current=data
  if(current.done){renderQuestion(current);return}
  history.push(createHistoryEntry(current));historyIndex=history.length-1;updatePrevButton();renderQuestion(current)
}
async function answerSingle(picked){
  if(locked)return;locked=true;answered++
  const res=await fetch("/api/dbx/check/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:current.id,picked,track:current.track,exam:current.exam})})
  const data=await res.json()
  if(data.ok)correct++;updateStreak(data.ok);updateScore(current.progress);saveAnswerInHistory(picked,data);paintSingleResult(data,picked);renderStatus(data)
}
async function answerMulti(){
  if(locked)return
  const picked=[...optionsEl.querySelectorAll("input:checked")].map(x=>x.value)
  if(!picked.length)return
  locked=true;answered++
  const res=await fetch("/api/dbx/check/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:current.id,picked,track:current.track,exam:current.exam})})
  const data=await res.json()
  if(data.ok)correct++;updateStreak(data.ok);updateScore(current.progress);saveAnswerInHistory(picked,data);paintMultiResult(data,picked);renderStatus(data)
}
function goPrev(){if(historyIndex<=0)return;restoreHistoryEntry(historyIndex-1)}
btnNext.onclick=loadQuestion;btnPrev.onclick=goPrev;btnReset.onclick=resetGame
quizEl.onchange=applyUI
examAssociate.onchange=()=>{resetLocal();loadQuestion()}
examProfessional.onchange=()=>{resetLocal();loadQuestion()}
document.addEventListener("keydown",e=>{
  if(isTypingTarget(e.target))return
  if(e.key==="ArrowDown"){e.preventDefault();const items=getNavigableOptions();if(!items.length)return;setActiveOption(activeOptionIndex<0?0:activeOptionIndex+1);return}
  if(e.key==="ArrowUp"){e.preventDefault();const items=getNavigableOptions();if(!items.length)return;setActiveOption(activeOptionIndex<0?0:activeOptionIndex-1);return}
  if(e.key==="Enter"){
    const items=getNavigableOptions()
    if(activeOptionIndex>=0&&items[activeOptionIndex]){
      e.preventDefault();const active=items[activeOptionIndex]
      if(active.classList.contains("opt")){active.click();return}
      if(active.classList.contains("optCheck")){const cb=active.querySelector("input[type='checkbox']");if(cb&&!locked){cb.checked=!cb.checked;setActiveFromElement(active)}}
      return
    }
  }
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();btnNext.click();return}
  if(e.key==="ArrowLeft"){e.preventDefault();btnPrev.click()}
})
applyUI()
</script>
</body>
</html>
